<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070722">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FooCat</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
</head>
<body>
<div id="stage">
  <div id="safe" aria-hidden="true"></div>
  <canvas id="screen" width="320" height="180" role="img" aria-label="FooCat, le chat licorne de l'espace"></canvas>
  <div id="touch" hidden>
    <div id="stick" aria-hidden="true"><div id="knob"></div></div>
    <button id="b-fire" class="tbtn fire" type="button" aria-label="Tirer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg><span>TIR</span>
    </button>
    <button id="b-swap" class="tbtn swap" type="button" aria-label="Changer d'arme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg><span>ARME</span>
    </button>
    <button id="b-special" class="tbtn special" type="button" aria-label="Lancer un casse-dents">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16M12 8a4 4 0 0 1 0 8"/></svg><span>CASSE</span>
    </button>
    <button id="b-pause" class="tbtn small" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
    </button>
    <button id="b-sound" class="tbtn small" type="button" aria-label="Couper le son">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="cross" d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
  </div>
  <form id="name-form" hidden autocomplete="off">
    <p class="nf-title">Nouveau record !</p>
    <p id="nf-score"></p>
    <label for="nf-input">Ton pseudonyme (12 lettres au maximum)</label>
    <input id="nf-input" name="pseudo" type="text" placeholder="Pseudonyme" maxlength="12" autocomplete="nickname" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <p id="nf-error" role="alert"></p>
    <div class="nf-buttons">
      <button type="submit" class="nf-ok">Valider</button>
      <button type="button" id="nf-skip" class="nf-skip">Passer</button>
    </div>
  </form>
  <div id="rotate" hidden><p>Tourne ton téléphone<br>en mode paysage</p></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
